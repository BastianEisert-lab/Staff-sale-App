
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Staff Sale">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Adidas Staff Sale</title>
<style>
:root{
font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
color:#17231d;background:#f2f5f3
}
*{box-sizing:border-box}
body{margin:0}
header{
background:#142820;color:white;
padding:calc(env(safe-area-inset-top) + 20px) 18px 24px
}
header h1{font-size:27px;margin:6px 0}
header p{color:#bdd3c5;font-size:13px;margin:0}
.wrap{max-width:700px;margin:auto;padding:15px}
section,.person{
background:white;border-radius:16px;
padding:16px;margin-bottom:13px;
box-shadow:0 2px 8px #00000009
}
button,input{font:inherit}
button{
background:white;border:1px solid #d9e0db;
border-radius:10px;padding:10px;cursor:pointer
}
button.primary{background:#142820;color:white}
button:active{opacity:.7}
.stats,.toolbar,.filters,.actions,.head{
display:flex;gap:8px;align-items:center
}
.stats>div{flex:1;text-align:center}
.number{font-size:25px;font-weight:800}
small{color:#718078}
.progress{
height:10px;background:#e5ebe6;
border-radius:10px;overflow:hidden;margin:14px 0 8px
}
#bar{height:100%;background:#21945b;width:0%}
.toolbar{margin:14px 0}
.toolbar input{
flex:1;min-width:0;padding:12px;
border:1px solid #d9e0db;border-radius:10px
}
.filters{margin-bottom:15px}
.filters button{flex:1}
.filters .active{background:#142820;color:white}
.head{justify-content:space-between}
.person h2{font-size:19px;margin:0 0 4px}
.wish{
border-top:1px solid #edf0ed;
padding:15px 0;display:flex;gap:10px
}
.wish input[type=checkbox]{
width:25px;height:25px;
accent-color:#21945b;flex-shrink:0
}
.main{flex:1;min-width:0}
.wishname{font-weight:650;font-size:15px}
.done .wishname{text-decoration:line-through;color:#849088}
.actions{flex-wrap:wrap;margin-top:10px}
.actions button{font-size:12px;padding:9px}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.photo{position:relative}
.photo img{
width:90px;height:90px;object-fit:cover;
border-radius:10px;cursor:pointer
}
.remove{
position:absolute;right:-4px;top:-5px;
background:#fff;color:#b00020;
border-radius:50%;padding:2px 7px
}
.addwish{width:100%;margin-top:8px}
.foot{font-size:12px;color:#718078;line-height:1.5}
.hidden{display:none}
#viewer{
display:none;position:fixed;inset:0;
background:#000e;z-index:100;
align-items:center;justify-content:center;
flex-direction:column;padding:20px
}
#viewer img{max-width:100%;max-height:78vh;object-fit:contain}
#viewer button{margin-top:18px}
#status{font-size:12px;margin-top:10px}
</style>
</head>
<body>
<header>
<div style="max-width:700px;margin:auto">
<div style="font-size:11px;letter-spacing:2px;color:#b9cfc0">
FRIENDS & FAMILY
</div>
<h1>STAFF SALE 👟</h1>
<p>Deine persönliche Adidas-Einkaufsliste</p>
</div>
</header>

<main class="wrap">
<section>
<div class="stats">
<div><div class="number" id="total">0</div><small>Wünsche</small></div>
<div><div class="number" id="done">0</div><small>Gekauft</small></div>
<div><div class="number" id="open">0</div><small>Offen</small></div>
</div>
<div class="progress"><div id="bar"></div></div>
<div id="percent" class="foot" style="text-align:right">0 % erledigt</div>
</section>

<div class="toolbar">
<input id="search" type="search" placeholder="Name, Größe oder Schuh suchen">
<button id="add" class="primary">+ Person</button>
</div>

<div class="filters">
<button data-filter="all" class="active">Alle</button>
<button data-filter="open">Offen</button>
<button data-filter="done">Gekauft</button>
</div>

<div id="list"></div>

<section>
<strong>Datensicherung</strong>
<p class="foot">
Deine Fotos, Namen und Häkchen werden lokal auf deinem iPhone gespeichert.
Exportiere regelmäßig eine Sicherung. Es gibt keine Cloud-Synchronisierung.
</p>
<div class="actions">
<button id="export">Sicherung exportieren</button>
<button id="import">Sicherung importieren</button>
<button id="reset">Liste zurücksetzen</button>
</div>
<div id="status"></div>
</section>
</main>

<input id="camera" class="hidden" type="file"
accept="image/*" capture="environment">
<input id="gallery" class="hidden" type="file"
accept="image/*" multiple>
<input id="fileimport" class="hidden" type="file"
accept="application/json,.json">

<div id="viewer">
<img id="largephoto" alt="Schuhfoto">
<button id="closeviewer">Schließen ✕</button>
</div>

<script>
const source=[
["Laura","37 1/3",[
"Samba mit Plateau",
"Gazelle",
"Samba andere Farbe / Leo"
],false],

["Nelli","45 2/3 / 46",[
"Laufschuh",
"Sneaker"
],false],

["Papa","42",[
"Sneaker"
],false],

["Mama","38 1/3",[
"Sneaker Leo"
],false],

["Diana","39 1/3",[
"Gazelle Plateau beige",
"Adiletten",
"Campus beige / Grautöne"
],false],

["Ingo","45 1/3",[
"Sneaker"
],false],

["Mark","46 / 47",[
"Laufschuhe"
],false],

["Michel","32 / 33",[
"Sneaker",
"Fußballschuhe",
"Hosen Größe 140",
"Oberteile Größe 140",
"Cap",
"Adiletten"
],false],

["Dirk","44",[
"Sportliche Sneaker Paar 1",
"Sportliche Sneaker Paar 2"
],false],

["Theo","26",[
"Trikot Größe 128"
],false],

["Gerrit","42 2/3",[
"Sneaker"
],false],

["Salo","37 2/3",[
"Laufschuhe",
"Spezialwunsch – Details ergänzen"
],false],

["Tilda","34 2/3",[
"Sneaker beige / weiß / rosé"
],false],

["Shkamb","43",[
"Schuhwunsch noch ergänzen"
],false],

["Klaus Fiening","46",[
"Weiße Laufschuhe"
],false],

["Eileen","39",[
"Samba Leo",
"Campus – genaue Angabe ergänzen"
],true],

["Sina","38",[
"Samba Plateau weiß / Leo"
],true],

["Lulu","38 2/3",[
"Schuhwunsch noch ergänzen"
],true],

["Eileen","39",[
"Samba Leo",
"Campus – genaue Angabe ergänzen"
],true],

["Raphi","42 2/3",[
"Schuhwunsch noch ergänzen"
],true],

["Mark","46 / 47",[
"Laufschuhe"
],true]
];

const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);

const initial=()=>source.map(p=>({
id:uid(),
name:p[0],
size:p[1],
items:p[2].map(w=>({
id:uid(),name:w,done:p[3],photos:[]
}))
}));

let people=initial();
let filter="all";
let target=null;
let loaded=false;

const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
}[c]));

const db=new Promise((resolve,reject)=>{
let req=indexedDB.open("staffsale-db",1);
req.onupgradeneeded=()=>{
if(!req.result.objectStoreNames.contains("data"))
req.result.createObjectStore("data");
};
req.onsuccess=()=>resolve(req.result);
req.onerror=()=>reject(req.error);
});

async function getData(){
const d=await db;
return new Promise((res,rej)=>{
const r=d.transaction("data","readonly")
.objectStore("data").get("people");
r.onsuccess=()=>res(r.result);
r.onerror=()=>rej(r.error);
});
}

async function save(){
if(!loaded)return;
try{
const d=await db;
await new Promise((res,rej)=>{
const t=d.transaction("data","readwrite");
t.objectStore("data").put(people,"people");
t.oncomplete=res;
t.onerror=()=>rej(t.error);
});
$("status").textContent="✓ Lokal gespeichert";
}catch(e){
$("status").textContent="⚠ Speichern fehlgeschlagen! Bitte Sicherung exportieren.";
}
}

function update(){render();save()}

function render(){
const all=people.flatMap(p=>p.items);
const done=all.filter(i=>i.done).length;
$("total").textContent=all.length;
$("done").textContent=done;
$("open").textContent=all.length-done;
const percent=all.length?Math.round(done/all.length*100):0;
$("bar").style.width=percent+"%";
$("percent").textContent=percent+" % erledigt";

const q=$("search").value.toLowerCase();

const filtered=people.map(p=>({
...p,
items:p.items.filter(i=>
(filter==="all"||(filter==="done"?i.done:!i.done))&&
[p.name,p.size,i.name].join(" ").toLowerCase().includes(q)
)
})).filter(p=>p.items.length);

$("list").innerHTML=filtered.length?
filtered.map(p=>`
<article class="person">
<div class="head">
<div>
<h2>${escapeHTML(p.name)}</h2>
<small>Schuhgröße: ${escapeHTML(p.size||"–")}</small>
</div>
<button data-action="editperson" data-p="${p.id}">✎</button>
</div>

${p.items.map(i=>`
<div class="wish ${i.done?"done":""}">
<input type="checkbox" data-action="toggle"
data-p="${p.id}" data-i="${i.id}"
aria-label="Als gekauft markieren"
${i.done?"checked":""}>

<div class="main">
<div class="wishname">${escapeHTML(i.name)}</div>

<div class="photos">
${(i.photos||[]).map((ph,n)=>`
<div class="photo">
<img src="${ph}" data-action="view"
data-p="${p.id}" data-i="${i.id}" data-n="${n}"
alt="Schuhfoto">
<button class="remove" data-action="removephoto"
data-p="${p.id}" data-i="${i.id}" data-n="${n}"
aria-label="Foto löschen">×</button>
</div>
`).join("")}
</div>

<div class="actions">
<button data-action="camera" data-p="${p.id}" data-i="${i.id}">
📷 Kamera
</button>
<button data-action="gallery" data-p="${p.id}" data-i="${i.id}">
🖼️ Galerie
</button>
<button data-action="editwish" data-p="${p.id}" data-i="${i.id}">
Bearbeiten
</button>
</div>
</div>
</div>
`).join("")}

<button class="addwish" data-action="addwish" data-p="${p.id}">
+ Weiterer Schuhwunsch
</button>
</article>
`).join(""):
"<section>Keine passenden Wünsche gefunden.</section>";
}

$("list").addEventListener("click",e=>{
const el=e.target.closest("[data-action]");
if(!el||el.dataset.action==="toggle")return;

const p=people.find(x=>x.id===el.dataset.p);
const i=p?.items.find(x=>x.id===el.dataset.i);
const a=el.dataset.action;

if(a==="camera"||a==="gallery"){
target=i;
$(a).click();
}

if(a==="view"){
const ph=i?.photos?.[Number(el.dataset.n)];
if(!ph)return;
$("largephoto").src=ph;
$("viewer").style.display="flex";
}

if(a==="editperson"){
let n=prompt("Name",p.name);
if(n===null)return;
let s=prompt("Schuhgröße",p.size);
if(s===null)return;
p.name=n.trim()||p.name;
p.size=s.trim();
update();
}

if(a==="editwish"){
let n=prompt("Schuhwunsch",i.name);
if(n?.trim()){
i.name=n.trim();
update();
}
}

if(a==="addwish"){
let n=prompt("Weiterer Schuh oder Artikel");
if(n?.trim()){
p.items.push({
id:uid(),name:n.trim(),done:false,photos:[]
});
update();
}
}

if(a==="removephoto"&&confirm("Dieses Foto löschen?")){
i.photos.splice(Number(el.dataset.n),1);
update();
}
});

$("list").addEventListener("change",e=>{
const el=e.target;
if(el.dataset.action!=="toggle")return;
const p=people.find(x=>x.id===el.dataset.p);
const i=p?.items.find(x=>x.id===el.dataset.i);
if(!i)return;
i.done=el.checked;
update();
});

async function addPhotos(files){
const current=target;
if(!current)return;
for(const f of files){
if(!f.type.startsWith("image/"))continue;
try{
const data=await new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=()=>resolve(reader.result);
reader.onerror=reject;
reader.readAsDataURL(f);
});
const compressed=await new Promise((resolve,reject)=>{
const img=new Image();
img.onload=()=>{
const scale=Math.min(1,1000/Math.max(img.width,img.height));
const canvas=document.createElement("canvas");
canvas.width=Math.round(img.width*scale);
canvas.height=Math.round(img.height*scale);
canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
resolve(canvas.toDataURL("image/jpeg",0.72));
};
img.onerror=reject;
img.src=data;
});
current.photos=current.photos||[];
current.photos.push(compressed);
update();
}catch(err){
alert("Ein Foto konnte nicht verarbeitet werden.");
}
}
}

["camera","gallery"].forEach(id=>{
$(id).addEventListener("change",async e=>{
const files=Array.from(e.target.files||[]);
e.target.value="";
await addPhotos(files);
});
});

$("closeviewer").onclick=()=>{
$("viewer").style.display="none";
$("largephoto").removeAttribute("src");
};

$("viewer").addEventListener("click",e=>{
if(e.target.id==="viewer")$("closeviewer").click();
});

$("search").addEventListener("input",render);

document.querySelectorAll("[data-filter]").forEach(b=>{
b.addEventListener("click",()=>{
filter=b.dataset.filter;
document.querySelectorAll("[data-filter]").forEach(x=>
x.classList.toggle("active",x===b)
);
render();
});
});

$("add").onclick=()=>{
let name=prompt("Name der Person");
if(!name?.trim())return;
let size=prompt("Schuhgröße")||"";
let wish=prompt("Erster Schuhwunsch")||"Wunsch ergänzen";
people.push({
id:uid(),name:name.trim(),size,
items:[{
id:uid(),name:wish,done:false,photos:[]
}]
});
update();
};

$("export").onclick=()=>{
const blob=new Blob([
JSON.stringify({
version:2,
exported:new Date().toISOString(),
people
})
],{type:"application/json"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="staff-sale-sicherung.json";
a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);
};

$("import").onclick=()=>$("fileimport").click();

$("fileimport").onchange=async e=>{
const f=e.target.files[0];
if(!f)return;
try{
const obj=JSON.parse(await f.text());
if(!Array.isArray(obj.people)||
!obj.people.every(p=>
typeof p.name==="string"&&Array.isArray(p.items)
))throw Error("Ungültiges Format");
if(confirm("Aktuelle Liste durch diese Sicherung ersetzen?")){
people=obj.people;
update();
}
}catch(err){
alert("Sicherung konnte nicht gelesen werden.");
}
e.target.value="";
};

$("reset").onclick=()=>{
if(confirm("Wirklich alle Personen, Häkchen und Fotos löschen?")){
people=[];
update();
}
};

(async()=>{
try{
const stored=await getData();
if(Array.isArray(stored))people=stored;
}catch(e){
$("status").textContent="⚠ Lokaler Speicher nicht verfügbar";
}
loaded=true;
render();
})();

if("serviceWorker" in navigator){
navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
</body>
</html>
